<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إنشاء حساب</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container" style="max-width: 400px; margin-top: 80px;">
        <div class="card shadow-sm p-4">
    <div class="text-center mb-3">
        <a href="{% url 'home' %}" class="text-decoration-none text-muted">
            📋 نظام إدارة المهام
        </a>
    </div>
    <h3 class="text-center mb-4">📝 إنشاء حساب جديد</h3>

            {% if form.errors %}
                <div class="alert alert-danger">
                    {% for field in form %}
                        {% for error in field.errors %}
                            <p class="mb-0">{{ error }}</p>
                        {% endfor %}
                    {% endfor %}
                </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">اسم المستخدم</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">كلمة المرور</label>
                    <input type="password" name="password1" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">تأكيد كلمة المرور</label>
                    <input type="password" name="password2" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-success w-100">إنشاء الحساب</button>
            </form>

            <p class="text-center mt-3">
                عندك حساب؟ <a href="{% url 'login' %}">سجل دخولك</a>
            </p>
        </div>
    </div>
</body>
</html>
