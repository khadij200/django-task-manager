{% extends 'tasks/base.html' %}
{% block title %}إضافة أو تعديل مهمة{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-4 shadow-sm">
                <h4 class="mb-4">📝 بيانات المهمة</h4>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">العنوان</label>
                        {{ form.title }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label">الوصف</label>
                        {{ form.description }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label">الحالة</label>
                        {{ form.status }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label">الأولوية</label>
                        {{ form.priority }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label">تاريخ الاستحقاق</label>
                        {{ form.due_date }}
                    </div>
                    <button type="submit" class="btn btn-primary">حفظ المهمة</button>
                    <a href="{% url 'task_list' %}" class="btn btn-secondary">إلغاء</a>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
