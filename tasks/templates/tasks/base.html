<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}نظام إدارة المهام{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Segoe UI', sans-serif;
        }
        .navbar-brand {
            font-weight: bold;
        }
        .task-card {
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            border: none;
            transition: transform 0.15s;
        }
        .task-card:hover {
            transform: translateY(-2px);
        }
        .priority-high {
            border-right: 5px solid #dc3545;
        }
        .priority-low {
            border-right: 5px solid #6c757d;
        }
        .status-done {
            opacity: 0.6;
            text-decoration: line-through;
        }
    </style>
</head>
<body>
   <nav class="navbar navbar-dark mb-4 shadow-sm" style="background-color: #4f46e5;">
    <div class="container">
        <div class="d-flex align-items-center">
            <a class="navbar-brand mb-0" href="{% url 'task_list' %}">📋 نظام إدارة المهام</a>
            {% if user.is_authenticated %}
                <a href="{% url 'chatbot' %}" class="btn btn-outline-light btn-sm ms-3">🤖 المساعد الذكي</a>
            {% endif %}
        </div>

        {% if user.is_authenticated %}
            <div class="d-flex align-items-center">
                <span class="text-white me-3">مرحباً، {{ user.username }}</span>
                <form method="post" action="{% url 'logout' %}" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-light btn-sm">تسجيل خروج</button>
                </form>
            </div>
        {% endif %}
    </div>
</nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
