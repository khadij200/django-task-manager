<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نظام إدارة المهام</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
        }
        .hero-box {
            background: white;
            border-radius: 20px;
            padding: 50px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 500px;
            margin: auto;
        }
        .hero-icon {
            font-size: 60px;
        }
    </style>
</head>
<body>
    <div class="hero-box">
        <div class="hero-icon mb-3">📋</div>
        <h2 class="mb-3">نظام إدارة المهام</h2>
        <p class="text-muted mb-4">
            نظّم مهامك اليومية بسهولة، حدد أولوياتك، وتابع إنجازاتك — كل شي بمكان واحد.
        </p>
        <div class="d-grid gap-2">
            <a href="{% url 'login' %}" class="btn btn-primary btn-lg">تسجيل الدخول</a>
            <a href="{% url 'signup' %}" class="btn btn-outline-primary btn-lg">إنشاء حساب جديد</a>
        </div>
    </div>
</body>
</html>
