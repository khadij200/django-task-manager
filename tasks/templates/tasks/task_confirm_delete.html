{% extends 'tasks/base.html' %}
{% block title %}تأكيد الحذف{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card p-4 shadow-sm text-center">
                <p style="font-size: 40px;">⚠️</p>
                <h4>تأكيد الحذف</h4>
                <p class="text-muted">متأكد تبي تحذف المهمة "<strong>{{ task.title }}</strong>"؟</p>
                <form method="post" class="d-flex justify-content-center gap-2 mt-3">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">نعم، احذفها</button>
                    <a href="{% url 'task_list' %}" class="btn btn-secondary">إلغاء</a>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
